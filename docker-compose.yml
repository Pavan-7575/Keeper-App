services:
  # PostgreSQL Database Container
  postgres:
    image: postgres:16-alpine
    container_name: keeper_postgres
    restart: always
    environment:
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:-postgres}
      POSTGRES_DB: ${PGDATABASE:-keeper_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-postgres} -d ${PGDATABASE:-keeper_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Express Node.js Backend Container
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: keeper_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      PORT: 5000
      NODE_ENV: production
      CLIENT_URL: http://localhost:5173
      BACKEND_URL: http://localhost:5000
      PGHOST: postgres
      PGPORT: ${PGPORT:-5432}
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD:-postgres}
      PGDATABASE: ${PGDATABASE:-keeper_db}
      JWT_SECRET: ${JWT_SECRET:-keeper_jwt_access_token_secret_key_32190847}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-keeper_jwt_refresh_token_secret_key_84930218}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-Keeper App <no-reply@keeperapp.com>}
    volumes:
      - backend_uploads:/app/uploads

  # React Vite Frontend Container (Served via Nginx)
  frontend:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: keeper_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
    driver: local
  backend_uploads:
    driver: local

